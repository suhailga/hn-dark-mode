<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HN Dark Mode</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="toolbar">
        <div class="brand" aria-hidden="true">Y</div>
        <div class="copy">
          <h1>HN Dark Mode</h1>
          <p id="status">Dark mode is on</p>
        </div>
        <label class="switch">
          <input id="dark-mode-toggle" type="checkbox" role="switch" aria-describedby="status">
          <span class="slider"></span>
          <span class="sr-only">Enable dark mode</span>
        </label>
      </header>

      <section class="top-posts" aria-labelledby="top-posts-heading">
        <div class="section-heading">
          <h2 id="top-posts-heading">Top posts</h2>
          <div class="time-window" role="group" aria-label="Top posts time window">
            <button type="button" data-window="12h" aria-pressed="true">12 hours</button>
            <button type="button" data-window="1d" aria-pressed="false">1 day</button>
          </div>
        </div>
        <div class="column-headings" aria-hidden="true">
          <span>Votes</span>
          <span>Title</span>
          <span>Ratio</span>
        </div>
        <ol id="top-post-list" aria-live="polite">
          <li class="message">
            <span class="loader" aria-hidden="true"></span>
            Loading posts...
          </li>
        </ol>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
